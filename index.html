<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangon Taxi Fair V3 - GPS</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <span class="taxi-icon">🚖</span>
                <h1 id="app-title">Yangon Taxi V3 (GPS)</h1>
            </div>
            <button id="settings-btn" class="icon-btn" title="Settings">⚙️ Setting</button>
        </header>

        <!-- Mode Switcher -->
        <div class="mode-selector">
            <button class="mode-tab active" data-mode="passenger">👤 ခရီးသည် Mode</button>
            <button class="mode-tab" data-mode="driver">🚖 Taxi ဆရာ Mode</button>
        </div>

        <!-- Main Calculator Card -->
        <main class="card">
            <!-- Location & GPS Section -->
            <div class="input-group">
                <label>📍 ထွက်ခွာမည့်နေရာ (Start Location)</label>
                <div class="location-row">
                    <input type="text" id="start-location" placeholder="လက်ရှိနေရာ (ወይም နေရာအမည်)" readonly>
                    <button id="get-gps-btn" class="secondary-btn">🛰️ GPS ယူမည်</button>
                </div>
            </div>

            <div class="input-group">
                <label>🏁 ရောက်ရှိမည့်နေရာ (Destination)</label>
                <input type="text" id="end-location" placeholder="သွားမည့်နေရာအမည် (ဥပမာ- သိန်ဖြူ)">
            </div>

            <!-- Map Container -->
            <div id="map" style="width: 100%; height: 200px; border-radius: 12px; margin-top: 4px; display: none;"></div>

            <div class="input-group" style="margin-top: 10px;">
                <label for="km-input">ခရီးအကွာအဝေး (KM) - GPS ဖြင့် အလိုအလျောက် (သို့) ကိုယ်တိုင်ပြင်ရန်</label>
                <input type="number" id="km-input" placeholder="ဥပမာ - 5" step="0.1" min="0">
            </div>

            <div class="input-group">
                <label for="waiting-input">စောင့်ရချိန် (မိနစ်)</label>
                <input type="number" id="waiting-input" placeholder="ဥပမာ - 10" min="0">
            </div>

            <button id="calculate-btn" class="primary-btn">🧮 ခရီးခတွက်မည်</button>

            <!-- Result Section -->
            <div class="result-box">
                <span class="result-label">သင့်တင်သော ခန့်မှန်းခ (Fare Estimate)</span>
                <div class="result-value"><span id="total-fare">0</span> <span class="currency">Ks</span></div>
                <div class="breakdown" id="fare-breakdown">စတင်ခ: 2,500 Ks | KM ဖိုး: 0 Ks | စောင့်ခ: 0 Ks</div>
            </div>
        </main>

        <!-- Footer Info -->
        <footer class="info-footer">
            <p>💡 GPS & Location ပံ့ပိုးပေးထားသော Yangon Taxi V3 ဖြစ်ပါသည်။</p>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Admin Setting (နှုန်းထားများ)</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="setting-base">စတင်ခ (Ks)</label>
                    <input type="number" id="setting-base" value="2500">
                </div>
                <div class="input-group">
                    <label for="setting-km">1 KM လျှင် (Ks)</label>
                    <input type="number" id="setting-km" value="1200">
                </div>
                <div class="input-group">
                    <label for="setting-waiting">စောင့်ခ (1 မိနစ် လျှင် Ks)</label>
                    <input type="number" id="setting-waiting" value="100">
                </div>
                <button id="save-settings" class="primary-btn">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
