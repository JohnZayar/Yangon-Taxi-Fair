<section class="card">
  <div class="mode">
    <button class="mode-btn active" data-mode="passenger">👤 ခရီးသည်</button>
    <button class="mode-btn" data-mode="driver">🚕 Taxi ဆရာ</button>
  </div>

  <h2>📍 ခရီးခတွက်ရန်</h2>

  <label for="distance">ခရီးအကွာအဝေး (KM)</label>
  <input id="distance" type="number" min="0" step="0.1" placeholder="ဥပမာ 5">

  <label for="waiting">စောင့်ရချိန် (မိနစ်)</label>
  <input id="waiting" type="number" min="0" step="1" value="0">

  <button id="calculate" class="calculate">💰 ခရီးခတွက်မည်</button>

  <div id="result" class="result hidden">
    <div class="result-title">သင့်တင့်သော ခန့်မှန်းခ</div>
    <div id="fare" class="fare">0 Ks</div>
    <div id="details" class="details"></div>
    <div class="range">
      <span>🟢 ပုံမှန်အကွာအဝေး</span>
      <strong id="fareRange">0–0 Ks</strong>
    </div>
  </div>
</section>

<section class="card info">
  <h2>ℹ️ V1 တွက်ချက်နှုန်း</h2>
  <div class="rate-row"><span>စတင်ခ</span><strong>2,500 Ks</strong></div>
  <div class="rate-row"><span>1 KM</span><strong>1,200 Ks</strong></div>
  <div class="rate-row"><span>Waiting 1 မိနစ်</span><strong>100 Ks</strong></div>
  <p>ဤနှုန်းထားသည် App ၏ အခြေခံခန့်မှန်းနှုန်းဖြစ်ပြီး တရားဝင် Taxi သတ်မှတ်ဈေးနှုန်း မဟုတ်ပါ။</p>
</section>

<footer>Yangon Taxi Fair • V1</footer>
