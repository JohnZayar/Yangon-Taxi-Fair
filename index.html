<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b7a75">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Yangon Taxi Fair</title>
</head>
<body>
<div class="app">
<header>
<div class="car">🚕</div>
<h1>Yangon Taxi Fair</h1>
<p>ခရီးသည်နှင့် Taxi ဆရာ နှစ်ဖက်လုံးအတွက်</p>
</header>

<div class="tabs">
<button class="active">👤 ခရီးသည်</button>
<button>🚕 Taxi ဆရာ</button>
</div>

<div class="card">
<h2>📍 ခရီးခတွက်ရန်</h2>
<input id="from" placeholder="စထွက်မည့်နေရာ">
<input id="to" placeholder="သွားမည့်နေရာ">
<input id="km" type="number" placeholder="အကွာအဝေး KM">
<input id="wait" type="number" placeholder="Waiting မိနစ်" value="0">
<button id="calc">💰 တွက်မည်</button>
</div>

<div id="result" class="card result">
<h3>ခန့်မှန်း Taxi ခ</h3>
<div id="price">0 Ks</div>
<p id="info"></p>
</div>

<div class="card">
<h3>⚙️ V1 စံနှုန်း</h3>
<p>စတင်ခ : 2,500 Ks</p>
<p>1 KM : 1,200 Ks</p>
<p>Waiting : 100 Ks / မိနစ်</p>
</div>

</div>
<script src="app.js"></script>
</body>
</html>
