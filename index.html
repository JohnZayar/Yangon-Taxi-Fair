<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangon Taxi Fair V6</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <span class="taxi-icon">🚖</span>
                <h1>Yangon Taxi Fair</h1>
            </div>
            <button id="settings-btn" class="icon-btn">⚙️ Setting</button>
        </header>

        <!-- Main Calculator Card -->
        <main class="card">
            <!-- Township Dropdown for Easy Selection -->
            <div class="input-group">
                <label for="township-select">📍 သွားမည့် မြို့နယ်ကို ရွေးပါ</label>
                <select id="township-select">
                    <option value="">-- မြို့နယ် ရွေးချယ်ပါ --</option>
                    <option value="4">တာမွေ (4 KM)</option>
                    <option value="5">ကမာရွတ် (5 KM)</option>
                    <option value="6">လှိုင် (6 KM)</option>
                    <option value="3.5">စူးလေ / ကျောက်တတန်း (3.5 KM)</option>
                    <option value="5.5">ဗိုလ်တထောင် (5.5 KM)</option>
                    <option value="8">မြောက်ဥက္ကလာ / သုဝဏ္ဏ (8 KM)</option>
                    <option value="12">အင်းစိန် (12 KM)</option>
                    <option value="14.5">လှိုင်သာယာ (14.5 KM)</option>
                    <option value="18">သန်လျင် (18 KM)</option>
                </select>
            </div>

            <!-- Manual KM Input -->
            <div class="input-group">
                <label for="km-input">ခရီးအကွာအဝေး (KM) - သို့မဟုတ် ကိုယ်တိုင်ရိုက်ရန်</label>
                <input type="number" id="km-input" placeholder="ဥပမာ - 5" step="0.5" min="0">
            </div>

            <!-- Waiting Time -->
            <div class="input-group">
                <label for="waiting-input">စောင့်ရချိန် (မိနစ်)</label>
                <input type="number" id="waiting-input" placeholder="ဥပမာ - 10" min="0">
            </div>

            <button id="calculate-btn" class="primary-btn">🧮 ခရီးခတွက်မည်</button>

            <!-- Result Section -->
            <div class="result-box">
                <span class="result-label">သင့်တင်သော ခန့်မှန်းခ</span>
                <div class="result-value"><span id="total-fare">0</span> <span class="currency">Ks</span></div>
                <div class="breakdown" id="fare-breakdown">စတင်ခ: 2,500 Ks | KM ဖိုး: 0 Ks | စောင့်ခ: 0 Ks</div>
            </div>
        </main>

        <!-- Footer Info -->
        <footer class="info-footer">
            <p>💡 လူကြီးများအတွက် အလွန်လွယ်ကူ မြန်ဆန်သော Yangon Taxi V6 ဖြစ်ပါသည်။</p>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Admin Setting (နှုန်းထားများ)</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="setting-base">စတင်ခ (Ks)</label>
                    <input type="number" id="setting-base" value="2500">
                </div>
                <div class="input-group">
                    <label for="setting-km">1 KM လျှင် (Ks)</label>
                    <input type="number" id="setting-km" value="1200">
                </div>
                <div class="input-group">
                    <label for="setting-waiting">စောင့်ခ (1 မိနစ် လျှင် Ks)</label>
                    <input type="number" id="setting-waiting" value="100">
                </div>
                <button id="save-settings" class="primary-btn">သိမ်းဆည်းမည်</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
